<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Tetris Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glow-effect {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        /* Custom Touch Controls styling */
        .touch-btn {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        .touch-btn:active {
            transform: scale(0.95);
        }

        /* Canvas Border Styling */
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-6 min-h-screen">

    <!-- Header -->
    <header class="text-center my-2 md:my-4">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-500 drop-shadow-sm">
            TETRIS
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">GitHub Pages Deployment Ready</p>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex flex-col md:flex-row items-center md:items-start justify-center gap-6 my-auto">
        
        <!-- Left Panel: Next Piece & Stats (Desktop) / Top Info (Mobile) -->
        <div class="flex flex-row md:flex-col gap-4 w-full md:w-48 justify-between">
            
            <!-- Next Piece Canvas Box -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col items-center flex-1 md:flex-initial">
                <span class="text-xs text-slate-400 font-bold tracking-wider mb-2 uppercase">Next Piece</span>
                <div class="bg-slate-950/80 p-2 rounded-xl border border-slate-800/80 flex items-center justify-center">
                    <canvas id="next-canvas" width="120" height="120"></canvas>
                </div>
            </div>

            <!-- Stats Container -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col justify-around flex-1 md:flex-initial gap-3">
                <div>
                    <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Score</div>
                    <div id="score" class="pixel-font text-lg md:text-xl text-yellow-400 mt-1 truncate">0</div>
                </div>
                <div class="border-t border-slate-700/50 pt-2">
                    <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Level</div>
                    <div id="level" class="pixel-font text-lg md:text-xl text-cyan-400 mt-1">1</div>
                </div>
                <div class="border-t border-slate-700/50 pt-2">
                    <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Lines</div>
                    <div id="lines" class="pixel-font text-lg md:text-xl text-emerald-400 mt-1">0</div>
                </div>
            </div>

        </div>

        <!-- Center Panel: Game Canvas -->
        <div class="relative group">
            <div class="glass-panel rounded-2xl p-3 md:p-4 glow-effect relative overflow-hidden">
                <canvas id="tetris-canvas" width="240" height="480" class="bg-slate-950 rounded-lg border border-slate-800/80 shadow-inner"></canvas>

                <!-- Overlay for Pause / Game Over / Start -->
                <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
                    <div id="overlay-title" class="pixel-font text-2xl md:text-3xl text-indigo-400 mb-4 leading-relaxed">
                        READY?
                    </div>
                    <p id="overlay-msg" class="text-sm text-slate-300 mb-6 max-w-xs">
                        Press Start to begin playing classic Tetris!
                    </p>
                    <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transform transition active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> START GAME
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Controls Info & Game Action Buttons -->
        <div class="flex flex-col gap-4 w-full md:w-52">
            
            <!-- Control Buttons -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col gap-3">
                <button id="pause-btn" disabled class="w-full py-2.5 px-4 bg-slate-700/60 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pause" id="pause-icon"></i> <span id="pause-text">Pause</span>
                </button>
                <button id="restart-btn" disabled class="w-full py-2.5 px-4 bg-rose-600/80 hover:bg-rose-600 text-white font-semibold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Restart
                </button>
            </div>

            <!-- Keyboard Guide (Desktop) -->
            <div class="glass-panel rounded-2xl p-4 hidden md:block">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Controls</h3>
                <ul class="text-xs space-y-2 text-slate-300">
                    <li class="flex justify-between items-center"><span class="bg-slate-800 px-2 py-1 rounded text-slate-400">← / →</span> Move Left/Right</li>
                    <li class="flex justify-between items-center"><span class="bg-slate-800 px-2 py-1 rounded text-slate-400">↑</span> Rotate</li>
                    <li class="flex justify-between items-center"><span class="bg-slate-800 px-2 py-1 rounded text-slate-400">↓</span> Soft Drop</li>
                    <li class="flex justify-between items-center"><span class="bg-slate-800 px-2 py-1 rounded text-slate-400">Space</span> Hard Drop</li>
                    <li class="flex justify-between items-center"><span class="bg-slate-800 px-2 py-1 rounded text-slate-400">P</span> Pause Game</li>
                </ul>
            </div>

        </div>
    </main>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-sm mt-4 md:hidden flex flex-col gap-2">
        <div class="flex justify-center gap-2">
            <button id="touch-rotate" class="touch-btn flex-1 py-3 bg-indigo-600/80 active:bg-indigo-700 text-white font-bold rounded-xl text-lg flex items-center justify-center">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="touch-hard-drop" class="touch-btn flex-1 py-3 bg-purple-600/80 active:bg-purple-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1">
                <i class="fa-solid fa-angles-down"></i> DROP
            </button>
        </div>
        <div class="flex justify-between gap-2">
            <button id="touch-left" class="touch-btn flex-1 py-4 bg-slate-800 active:bg-slate-700 text-white rounded-xl text-xl flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="touch-down" class="touch-btn flex-1 py-4 bg-slate-800 active:bg-slate-700 text-white rounded-xl text-xl flex items-center justify-center">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button id="touch-right" class="touch-btn flex-1 py-4 bg-slate-800 active:bg-slate-700 text-white rounded-xl text-xl flex items-center justify-center">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-6 text-center text-xs text-slate-500">
        <p>Built for GitHub Pages Test | Single File HTML Tetris</p>
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        // --- CONSTANTS & CONFIGURATION ---
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24; // Canvas size: 240x480

        // Tetromino Shapes & Colors
        const SHAPES = [
            [], // Empty
            [[1, 1, 1, 1]], // I (Cyan)
            [[1, 1], [1, 1]], // O (Yellow)
            [[0, 1, 0], [1, 1, 1]], // T (Purple)
            [[1, 0, 0], [1, 1, 1]], // J (Blue)
            [[0, 0, 1], [1, 1, 1]], // L (Orange)
            [[0, 1, 1], [1, 0, 0]], // S (Green) -> Modified classic shape
            [[1, 1, 0], [0, 1, 1]]  // Z (Red)
        ];

        // Refined Color Palette
        const COLORS = [
            'transparent',
            '#06b6d4', // I: Cyan
            '#eab308', // O: Yellow
            '#a855f7', // T: Purple
            '#3b82f6', // J: Blue
            '#f97316', // L: Orange
            '#22c55e', // S: Green
            '#ef4444'  // Z: Red
        ];

        // Sound Engine (Web Audio API for zero dependencies)
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, duration, type = 'sine') {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Audio context errors ignored
                }
            }

            move() { this.playTone(300, 0.05, 'triangle'); }
            rotate() { this.playTone(400, 0.08, 'sine'); }
            drop() { this.playTone(180, 0.1, 'square'); }
            clear() {
                this.playTone(523.25, 0.1, 'sine'); // C5
                setTimeout(() => this.playTone(659.25, 0.15, 'sine'), 80); // E5
            }
            gameOver() {
                this.playTone(150, 0.3, 'sawtooth');
            }
        }

        const sfx = new SoundEffects();

        // --- GAME VARIABLES ---
        let canvas, ctx;
        let nextCanvas, nextCtx;
        let board = [];
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let isPaused = false;
        let gameLoopId = null;
        let lastTime = 0;
        let dropCounter = 0;
        let dropInterval = 1000;

        let currentPiece = null;
        let nextPiece = null;

        // --- DOM ELEMENTS ---
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const linesEl = document.getElementById('lines');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const pauseText = document.getElementById('pause-text');
        const pauseIcon = document.getElementById('pause-icon');

        // --- INITIALIZATION ---
        window.onload = () => {
            canvas = document.getElementById('tetris-canvas');
            ctx = canvas.getContext('2d');
            nextCanvas = document.getElementById('next-canvas');
            nextCtx = nextCanvas.getContext('2d');

            resetBoard();
            drawBoard();
            drawNextPiece();

            // Event Listeners
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            restartBtn.addEventListener('click', startGame);

            document.addEventListener('keydown', handleKeyPress);

            // Touch Controls Setup
            setupTouchControls();
        };

        // --- BOARD MANAGEMENT ---
        function resetBoard() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }

        function createPiece(type) {
            return {
                shape: SHAPES[type],
                colorId: type,
                x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
                y: 0
            };
        }

        function getRandomPiece() {
            const type = Math.floor(Math.random() * 7) + 1;
            return createPiece(type);
        }

        // --- GAME CONTROL ---
        function startGame() {
            sfx.init();
            resetBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            gameOver = false;
            isPaused = false;

            updateStats();

            nextPiece = getRandomPiece();
            spawnPiece();

            overlay.classList.add('hidden');
            pauseBtn.disabled = false;
            restartBtn.disabled = false;

            pauseText.innerText = "Pause";
            pauseIcon.className = "fa-solid fa-pause";

            lastTime = performance.now();
            dropCounter = 0;

            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(update);
        }

        function spawnPiece() {
            currentPiece = nextPiece;
            nextPiece = getRandomPiece();
            drawNextPiece();

            // Check Game Over condition on spawn
            if (collide(board, currentPiece)) {
                handleGameOver();
            }
        }

        function togglePause() {
            if (gameOver) return;
            isPaused = !isPaused;

            if (isPaused) {
                overlayTitle.innerText = "PAUSED";
                overlayMsg.innerText = "Take a breather!";
                startBtn.classList.add('hidden');
                overlay.classList.remove('hidden');
                pauseText.innerText = "Resume";
                pauseIcon.className = "fa-solid fa-play";
            } else {
                overlay.classList.add('hidden');
                startBtn.classList.remove('hidden');
                pauseText.innerText = "Pause";
                pauseIcon.className = "fa-solid fa-pause";
                lastTime = performance.now();
                gameLoopId = requestAnimationFrame(update);
            }
        }

        function handleGameOver() {
            gameOver = true;
            sfx.gameOver();
            cancelAnimationFrame(gameLoopId);

            overlayTitle.innerText = "GAME OVER";
            overlayMsg.innerText = `Final Score: ${score}`;
            startBtn.classList.remove('hidden');
            startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> PLAY AGAIN`;
            overlay.classList.remove('hidden');

            pauseBtn.disabled = true;
        }

        // --- GAME LOOP & UPDATES ---
        function update(time = 0) {
            if (isPaused || gameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                moveDown();
            }

            draw();
            gameLoopId = requestAnimationFrame(update);
        }

        function moveDown() {
            currentPiece.y++;
            if (collide(board, currentPiece)) {
                currentPiece.y--;
                merge(board, currentPiece);
                sfx.drop();
                clearLines();
                spawnPiece();
            }
            dropCounter = 0;
        }

        function hardDrop() {
            if (isPaused || gameOver) return;
            while (!collide(board, currentPiece)) {
                currentPiece.y++;
            }
            currentPiece.y--;
            merge(board, currentPiece);
            sfx.drop();
            clearLines();
            spawnPiece();
            dropCounter = 0;
        }

        function moveLeft() {
            currentPiece.x--;
            if (collide(board, currentPiece)) {
                currentPiece.x++;
            } else {
                sfx.move();
            }
        }

        function moveRight() {
            currentPiece.x++;
            if (collide(board, currentPiece)) {
                currentPiece.x--;
            } else {
                sfx.move();
            }
        }

        function rotatePiece() {
            const matrix = currentPiece.shape;
            // Matrix Rotation (Transpose + Reverse)
            const rotated = matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
            
            const prevShape = currentPiece.shape;
            const prevX = currentPiece.x;
            currentPiece.shape = rotated;

            // Wall Kick Handling
            let offset = 1;
            while (collide(board, currentPiece)) {
                currentPiece.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > matrix[0].length) {
                    currentPiece.shape = prevShape;
                    currentPiece.x = prevX;
                    return;
                }
            }
            sfx.rotate();
        }

        // --- COLLISION & LINE CLEARING ---
        function collide(board, piece) {
            const m = piece.shape;
            for (let r = 0; r < m.length; r++) {
                for (let c = 0; c < m[r].length; c++) {
                    if (m[r][c] !== 0) {
                        let newX = piece.x + c;
                        let newY = piece.y + r;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) {
                            return true;
                        }
                        if (newY >= 0 && board[newY][newX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge(board, piece) {
            piece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) {
                        board[piece.y + r][piece.x + c] = piece.colorId;
                    }
                });
            });
        }

        function clearLines() {
            let linesCleared = 0;

            outer: for (let r = ROWS - 1; r >= 0; r--) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] === 0) continue outer;
                }

                const row = board.splice(r, 1)[0].fill(0);
                board.unshift(row);
                linesCleared++;
                r++; // Re-check same row index after shift
            }

            if (linesCleared > 0) {
                sfx.clear();
                lines += linesCleared;
                
                // Classic Scoring system
                const linePoints = [0, 100, 300, 500, 800];
                score += linePoints[linesCleared] * level;

                // Level up every 10 lines
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 90);

                updateStats();
            }
        }

        function updateStats() {
            scoreEl.innerText = score;
            levelEl.innerText = level;
            linesEl.innerText = lines;
        }

        // --- RENDER FUNCTIONS ---
        function draw() {
            // Clear main canvas
            ctx.fillStyle = '#020617'; // Dark canvas BG
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawBoard();
            drawGhostPiece();
            drawPiece(ctx, currentPiece);
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            }
        }

        function drawBoard() {
            board.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value > 0) {
                        drawBlock(ctx, c, r, COLORS[value]);
                    }
                });
            });
        }

        function drawPiece(context, piece, offsetX = 0, offsetY = 0) {
            piece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) {
                        drawBlock(context, piece.x + c + offsetX, piece.y + r + offsetY, COLORS[piece.colorId]);
                    }
                });
            });
        }

        function drawGhostPiece() {
            if (!currentPiece) return;
            const ghost = {
                ...currentPiece,
                shape: currentPiece.shape
            };

            while (!collide(board, ghost)) {
                ghost.y++;
            }
            ghost.y--;

            ghost.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) {
                        const x = (ghost.x + c) * BLOCK_SIZE;
                        const y = (ghost.y + r) * BLOCK_SIZE;
                        ctx.strokeStyle = COLORS[ghost.colorId];
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(x + 2, y + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                    }
                });
            });
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#020617';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!nextPiece) return;

            const shape = nextPiece.shape;
            const size = shape.length;
            const blockS = 22;

            // Center alignment math
            const offsetX = (nextCanvas.width - shape[0].length * blockS) / 2;
            const offsetY = (nextCanvas.height - shape.length * blockS) / 2;

            shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) {
                        const x = offsetX + c * blockS;
                        const y = offsetY + r * blockS;
                        
                        nextCtx.fillStyle = COLORS[nextPiece.colorId];
                        nextCtx.fillRect(x, y, blockS - 1, blockS - 1);
                        
                        // Bevel Light
                        nextCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        nextCtx.fillRect(x, y, blockS - 1, 3);
                        nextCtx.fillRect(x, y, 3, blockS - 1);
                    }
                });
            });
        }

        function drawBlock(context, x, y, color) {
            const px = x * BLOCK_SIZE;
            const py = y * BLOCK_SIZE;

            context.fillStyle = color;
            context.fillRect(px, py, BLOCK_SIZE, BLOCK_SIZE);

            // Bevel Highlights & Shadows for 3D Block Feel
            context.fillStyle = 'rgba(255, 255, 255, 0.3)';
            context.fillRect(px, py, BLOCK_SIZE, 3);
            context.fillRect(px, py, 3, BLOCK_SIZE);

            context.fillStyle = 'rgba(0, 0, 0, 0.3)';
            context.fillRect(px, py + BLOCK_SIZE - 3, BLOCK_SIZE, 3);
            context.fillRect(px + BLOCK_SIZE - 3, py, 3, BLOCK_SIZE);

            // Subtle Outer Grid border
            context.strokeStyle = 'rgba(0,0,0,0.1)';
            context.strokeRect(px, py, BLOCK_SIZE, BLOCK_SIZE);
        }

        // --- KEYBOARD & CONTROLS ---
        function handleKeyPress(e) {
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
                return;
            }

            if (isPaused || gameOver) return;

            switch (e.key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
        }

        function setupTouchControls() {
            document.getElementById('touch-left').addEventListener('click', () => { if(!isPaused && !gameOver) moveLeft(); });
            document.getElementById('touch-right').addEventListener('click', () => { if(!isPaused && !gameOver) moveRight(); });
            document.getElementById('touch-down').addEventListener('click', () => { if(!isPaused && !gameOver) moveDown(); });
            document.getElementById('touch-rotate').addEventListener('click', () => { if(!isPaused && !gameOver) rotatePiece(); });
            document.getElementById('touch-hard-drop').addEventListener('click', () => { if(!isPaused && !gameOver) hardDrop(); });
        }
    </script>
</body>
</html>
